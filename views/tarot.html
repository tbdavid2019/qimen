                var theme = localStorage.getItem('theme');

                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {}
        })();

<body class="suite-page" data-suite="tarot">

        <div class="collapse navbar-collapse navbar-ex1-collapse">

            </ul>

            <ul class="nav navbar-nav navbar-right">
                <li>
                    <a href="#" id="darkModeToggle" class="dark-mode-toggle"
                       data-label-light="暗黑" data-label-dark="明亮"
                       data-title-light="切換為暗黑模式" data-title-dark="切換為明亮模式"
                       role="button" aria-pressed="false">
                        <span class="dark-mode-label">暗黑</span>

                </li>

            </ul>

    </nav>

    <div class="suite-container">
        <div class="suite-hero">
            <span class="suite-hero-badge">🔮 心理塔羅 · 照見內心</span>
            <h1>塔羅心靈占卜</h1>
            <p class="suite-hero-subtitle">
                「塔羅是一面鏡子，反映你的內心與當下狀態。」輸入心中困惑，抽取 78 張完整牌陣，從四個角度整理牌面與行動指引。
            </p>
        </div>

        <div class="suite-card">
            <form id="suiteForm" toolname="tarot_reading" tooldescription="塔羅牌陣抽牌與解讀" toolautosubmit>
                <div class="suite-form-group">
                    <label for="tarotQuestion">心中所想的問題</label>
                    <input type="text" class="form-control input-lg" id="tarotQuestion" name="question"
                           toolparamdescription="想詢問的具體問題"
                           placeholder="例如：我最近在猶豫是否該換工作？或這段感情接下來的走向？" autofocus>
                </div>

                <div class="suite-form-group">
                    <label>選擇牌陣</label>
                    <div class="suite-chips">
                        <label class="suite-chip-radio">
                            <input type="radio" name="spread" value="three" checked toolparamdescription="塔羅牌陣：single、three、diamond、moon、horseshoe 或 celtic">
                            <span>🌟 三牌陣（過去·現在·未來）</span>
                        </label>
                        <label class="suite-chip-radio">
                            <input type="radio" name="spread" value="single">
                            <span>💫 單張指引（核心建議）</span>
                        </label>
                        <label class="suite-chip-radio">
                            <input type="radio" name="spread" value="diamond">
                            <span>💎 五牌陣（阻力與潛力）</span>
                        </label>
                        <label class="suite-chip-radio">
                            <input type="radio" name="spread" value="moon">
                            <span>🌙 月亮牌陣（情緒與週期）</span>
                        </label>
                        <label class="suite-chip-radio">
                            <input type="radio" name="spread" value="horseshoe">
                            <span>🐴 馬蹄形（發展路徑）</span>
                        </label>
                        <label class="suite-chip-radio">
                            <input type="radio" name="spread" value="celtic">
                            <span>⚔️ 凱爾特十字（全方位）</span>
                        </label>
                    </div>
                </div>

                <div class="suite-form-group" id="threeVariantGroup">
                    <label for="tarotVariant">三牌陣解讀視角</label>
                    <select class="form-control" id="tarotVariant" name="variant">
                        <option value="timeline" selected>時間流向（過去起因 ➔ 現在現狀 ➔ 未來趨勢）</option>
                        <option value="relationship">感情關係（我的狀態 ➔ 對方狀態 ➔ 雙方關係走向）</option>
                        <option value="decision">抉擇行動（面臨情境 ➔ 可行方案 ➔ 預期結果）</option>
                    </select>
                </div>

                <button type="submit" id="suiteSubmitBtn" class="suite-btn-submit">
                    <span>✨ 開始占卜並查看解讀</span>
                </button>
            </form>

            <!-- Visual Board -->
            <div id="suiteVisualBoard" class="suite-visual-board" hidden></div>

            <!-- 解讀與追問區域 -->
            <div id="suiteAiSection" class="suite-ai-section" hidden>
                <div class="suite-ai-header">
                    <h3 class="suite-ai-title">🔮 塔羅牌解讀</h3>
                </div>

                <div id="suiteAiLoading" class="suite-loading-state">
                    <div class="suite-spinner"></div>
                    <div>正在整理牌面與牌間關係…</div>
                </div>

                <div id="suiteConversation" class="suite-conversation-stream"></div>

                <form id="suiteFollowUpForm" class="suite-follow-up-form" hidden>
                    <input type="text" id="suiteFollowUpInput" class="suite-follow-up-input" placeholder="向塔羅顧問進一步追問（例如：逆位牌具體提醒我什麼？）">
                    <button type="submit" class="suite-follow-up-btn">追問</button>
                </form>
            </div>
        </div>
    </div>

    <%- include('partials/site-footer.html') %>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/theme.js"></script>

    <script src="/js/webmcp.js"></script>
    <script src="/js/divination-suite.js"></script>

</html>
