    <div class="suite-container">
        <div class="suite-hero">
            <span class="suite-hero-badge">🏡 堪輿智慧 · 科學人居</span>
            <h1>堪輿風水顧問</h1>
            <p class="suite-hero-subtitle">
                融匯八宅明鏡與九運玄空飛星；秉持「風水以採光、通風、動線與安全為本」之理念，由 AI 堪輿顧問提供實用的格局調整建議。
            </p>
        </div>

        <div class="suite-card">
            <form id="suiteForm" toolname="fengshui_report" tooldescription="八宅與九運飛星風水報告分析">
                <div class="suite-form-row">
                    <div class="suite-form-group">
                        <label for="fengshuiFacing">房屋朝向（大門或陽台朝向）</label>
                        <select class="form-control input-lg" id="fengshuiFacing" name="facing">
                            <option value="南" selected>朝南（坎宅 · 坐北朝南）</option>
                            <option value="北">朝北（離宅 · 坐南朝北）</option>
                            <option value="東">朝東（兌宅 · 坐西朝東）</option>
                            <option value="西">朝西（震宅 · 坐東朝西）</option>
                            <option value="東南">朝東南（乾宅 · 坐西北朝東南）</option>
                            <option value="西北">朝西北（巽宅 · 坐東南朝西北）</option>
                            <option value="東北">朝東北（坤宅 · 坐西南朝東北）</option>
                            <option value="西南">朝西南（艮宅 · 坐東北朝西南）</option>
                        </select>
                    </div>

                    <div class="suite-form-group">
                        <label for="residentYear">主要居住者出生年</label>
                        <input type="number" class="form-control input-lg" id="residentYear" name="residentYear" value="1990">
                    </div>

                    <div class="suite-form-group">
                        <label for="residentSex">性別</label>
                        <select class="form-control input-lg" id="residentSex" name="sex">
                            <option value="女" selected>女</option>
                            <option value="男">男</option>
                        </select>
                    </div>
                </div>

                <div class="suite-form-group">
                    <label for="fengshuiQuestion">想諮詢的空間或問題（選填）</label>
                    <input type="text" class="form-control input-lg" id="fengshuiQuestion" name="question"
                           placeholder="例如：主臥室與書房該如何安排？客廳財位佈置有何建議？">
                </div>

                <details class="suite-details">
                    <summary>⚙️ 進階建造／入住與流年設定</summary>
                    <div class="suite-details-body suite-form-row">
                        <div class="suite-form-group">
                            <label>入住／建造年份（決定運盤）</label>
                            <input type="number" class="form-control" name="moveInYear" value="2024">
                        </div>
                        <div class="suite-form-group">
                            <label>當前分析流年</label>
                            <input type="number" class="form-control" name="year" value="2026">
                        </div>
                    </div>
                </details>

                <button type="submit" id="suiteSubmitBtn" class="suite-btn-submit">
                    <span>✨ 生成風水格局並請教堪輿顧問</span>
                </button>
            </form>

            <!-- Visual Board -->
            <div id="suiteVisualBoard" class="suite-visual-board" hidden></div>

            <!-- AI Chat & Interpretation Section -->
            <div id="suiteAiSection" class="suite-ai-section" hidden>
                <div class="suite-ai-header">
                    <h3 class="suite-ai-title">🏡 堪輿顧問深度分析</h3>
                </div>

                <div id="suiteAiLoading" class="suite-loading-state">
                    <div class="suite-spinner"></div>
                    <div>顧問正在勘測八宅九星與流年飛星格局…</div>
                </div>

                <div id="suiteConversation" class="suite-conversation-stream"></div>

                <form id="suiteFollowUpForm" class="suite-follow-up-form" hidden>
                    <input type="text" id="suiteFollowUpInput" class="suite-follow-up-input" placeholder="向風水顧問追問（例如：床頭與書桌該如何擺放？）">
                    <button type="submit" class="suite-follow-up-btn">追問</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/theme.js"></script>
