    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#111a20">

    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) {
                    theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {}
        })();
    </script>

    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style-new.css">
    <link rel="stylesheet" href="/css/dark-mode.css">

</head>

<body class="suite-page" data-suite="fengshui">
    <nav class="navbar navbar-inverse navbar-fixed-top" role="navigation">

            </button>
            <a class="navbar-brand" href="/">333 一句提醒·照見當下</a>
        </div>

        <div class="collapse navbar-collapse navbar-ex1-collapse">

            </ul>

            <ul class="nav navbar-nav navbar-right">
                <li>
                    <a href="#" id="darkModeToggle" class="dark-mode-toggle"
                       data-label-light="暗黑" data-label-dark="明亮"
                       data-title-light="切換為暗黑模式" data-title-dark="切換為明亮模式"
                       role="button" aria-pressed="false">
                        <span class="dark-mode-label">暗黑</span>

    <div class="suite-container">
        <div class="suite-hero">
            <span class="suite-hero-badge">🏡 堪輿智慧 · 科學人居</span>
            <h1>堪輿風水顧問</h1>
            <p class="suite-hero-subtitle">
                「巒頭為體，理氣為用。」融匯三元玄空飛星、八宅明鏡、內外形煞化解與協紀辨方擇日，提供實用的格局與動線調整建議。
            </p>
        </div>

        <div class="suite-card">
            <form id="suiteForm" toolname="fengshui_report" tooldescription="八宅與九運飛星風水報告、煞氣診斷與擇日分析" toolautosubmit>
                <div class="suite-form-group">
                    <label for="fengshuiMode">選擇堪輿項目</label>
                    <select class="form-control input-lg" id="fengshuiMode" name="mode" toolparamdescription="風水服務模式：yangzhai(陽宅分析), shaqi(煞氣化解), zeri(擇日吉時)">
                        <option value="yangzhai" selected>🏡 陽宅玄空飛星與八宅分析（旺位凶位 · 空間佈局）</option>
                        <option value="shaqi">⚠️ 形煞與內外煞診斷（路沖/天斬/壁刀/穿堂風化解）</option>
                        <option value="zeri">📅 傳統擇日吉時（入宅/開業/動土/裝修吉日）</option>
                    </select>
                </div>

                <!-- 模式1: 陽宅分析 -->
                <div id="fsGroupYangzhai" class="fs-mode-group">
                    <div class="suite-form-row">
                        <div class="suite-form-group">
                            <label for="fengshuiFacing">房屋朝向（24山或8大方位）</label>
                            <select class="form-control input-lg" id="fengshuiFacing" name="facing" toolparamdescription="房屋大門或陽台的朝向方位">
                                <optgroup label="常用 8 大朝向">
                                    <option value="南" selected>朝南（坎宅 · 坐北朝南）</option>
                                    <option value="北">朝北（離宅 · 坐南朝北）</option>
                                    <option value="東">朝東（兌宅 · 坐西朝東）</option>
                                    <option value="西">朝西（震宅 · 坐東朝西）</option>
                                    <option value="東南">朝東南（乾宅 · 坐西北朝東南）</option>
                                    <option value="西北">朝西北（巽宅 · 坐東南朝西北）</option>
                                    <option value="東北">朝東北（坤宅 · 坐西南朝東北）</option>
                                    <option value="西南">朝西南（艮宅 · 坐東北朝西南）</option>
                                </optgroup>
                                <optgroup label="精確 24 山坐向">
                                    <option value="子山午向">子山午向（坐正北朝正南）</option>
                                    <option value="午山子向">午山子向（坐正南朝正北 · 九運旺山旺向）</option>
                                    <option value="卯山酉向">卯山酉向（坐正東朝正西 · 雙星到向）</option>
                                    <option value="酉山卯向">酉山卯向（坐正西朝正東 · 雙星到坐）</option>
                                    <option value="乾山巽向">乾山巽向（坐西北朝東南）</option>
                                    <option value="巽山乾向">巽山乾向（坐東南朝西北 · 九運旺山旺向）</option>
                                    <option value="艮山坤向">艮山坤向（坐東北朝西南 · 九運旺山旺向）</option>
                                    <option value="坤山艮向">坤山艮向（坐西南朝東北）</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="suite-form-group">
                            <label for="residentYear">主要居住者出生年</label>
                            <input type="number" class="form-control input-lg" id="residentYear" name="residentYear" value="1990" toolparamdescription="主要居住者的出生西元年份">
                        </div>

                        <div class="suite-form-group">
                            <label for="residentSex">性別</label>
                            <select class="form-control input-lg" id="residentSex" name="sex" toolparamdescription="主要居住者性別">
                                <option value="男" selected>男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                    </div>

                    <details class="suite-details">
                        <summary>⚙️ 進階建造／入住元運與分析流年</summary>
                        <div class="suite-details-body suite-form-row">
                            <div class="suite-form-group">
                                <label>入住／建造年份（決定運盤）</label>
                                <input type="number" class="form-control" id="moveInYear" name="moveInYear" value="2024" toolparamdescription="房屋入住或建造年份，用於運盤分析">
                            </div>
                            <div class="suite-form-group">
                                <label>當前分析流年</label>
                                <input type="number" class="form-control" id="year" name="year" value="2026" toolparamdescription="要分析的流年年份">
                            </div>
                        </div>
                    </details>
                </div>

                <!-- 模式2: 煞氣診斷 -->
                <div id="fsGroupShaqi" class="fs-mode-group" style="display:none;">
                    <div class="suite-form-group">
                        <label for="shaType">選擇疑似面臨的煞氣形態（外局形煞 / 內局空間六事）</label>
                        <select class="form-control input-lg" id="shaType" name="shaType">
                            <optgroup label="🏛️ 外局形煞 (建築與道路環境)">
                                <option value="天斬煞" selected>天斬煞（兩棟高樓窄縫如刀劈正對窗戶）</option>
                                <option value="路沖煞">路沖煞 / 槍煞（大門或陽台正對筆直長路或長廊）</option>
                                <option value="壁刀煞">壁刀煞（鄰棟建築外牆邊角如刀切入本宅）</option>
                                <option value="反弓煞">反弓煞 / 反弓水（道路或河流弧形彎道弓背頂宅）</option>
                                <option value="鐮刀煞">鐮刀煞（高架橋或陸橋弧形彎道橫切中低樓層）</option>
                                <option value="穿心煞">穿心煞（大樓下方有捷運地下道或大門直對立柱）</option>
                                <option value="白虎煞">白虎煞（右側建築動土施工或右高左低欺青龍）</option>
                                <option value="孤陽煞">孤陽煞（緊鄰廟宇/變電所/加油站，陽火燥烈）</option>
                                <option value="獨陰煞">獨陰煞（緊鄰醫院/殯儀館/公墓/老舊廢墟）</option>
                                <option value="探頭煞">探頭煞（前方建築後方露出更高建物一角如窺伺）</option>
                                <option value="頂心煞">頂心煞（門前正對路燈桿、電線桿或大樹幹）</option>
                                <option value="火形煞">火形煞（屋外正對高壓電塔、尖角屋頂或變壓器）</option>
                            </optgroup>
                            <optgroup label="🚪 內局空間六事 (格局與動線)">
                                <option value="穿堂煞">穿堂煞（大門直對客廳落地窗/陽台，第一漏財格）</option>
                                <option value="門沖床">門沖床（臥房房門直沖床頭或床身擾亂睡眠）</option>
                                <option value="樑壓床">樑壓床（臥房床頭上方有橫樑壓頂）</option>
                                <option value="橫樑壓頂">橫樑壓頂（沙發、書桌或辦公椅正上方有樑）</option>
                                <option value="樑壓灶">樑壓灶 / 門沖灶（瓦斯爐上方有橫樑或與門直沖）</option>
                                <option value="水火相沖">水火相沖（瓦斯爐與水槽緊鄰或正對冰箱）</option>
                                <option value="廁居中宮">廁居中宮（衛生間浴廁位於房屋九宮正中心）</option>
                                <option value="開門見灶">開門見灶（一進大門視線直見瓦斯爐灶）</option>
                                <option value="開門見廁">開門見廁（一進大門正對洗手間衛生間門）</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <!-- 模式3: 擇日吉時 -->
                <div id="fsGroupZeri" class="fs-mode-group" style="display:none;">
                    <div class="suite-form-row">
                        <div class="suite-form-group">
                            <label for="zeriMatter">擇日事項類型</label>
                            <select class="form-control input-lg" id="zeriMatter" name="zeriMatter">
                                <option value="入宅/喬遷" selected>入宅 / 喬遷搬家</option>
                                <option value="開業/開市">開業 / 開市迎財</option>
                                <option value="動土/裝修">動土 / 裝修施工</option>
                                <option value="婚嫁/嫁娶">婚嫁 / 訂婚嫁娶</option>
                            </select>
                        </div>
                        <div class="suite-form-group">
                            <label for="zeriYear">計劃年份</label>
                            <input type="number" class="form-control input-lg" id="zeriYear" name="zeriYear" value="2026">
                        </div>
                        <div class="suite-form-group">
                            <label for="zeriMonth">計劃月份</label>
                            <select class="form-control input-lg" id="zeriMonth" name="zeriMonth">
                                <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
                                <option value="4">4月</option><option value="5" selected>5月</option><option value="6">6月</option>
                                <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
                                <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="suite-form-group" style="margin-top:12px;">
                    <label for="fengshuiQuestion">想諮詢的具體空間或問題（選填）</label>
                    <input type="text" class="form-control input-lg" id="fengshuiQuestion" name="question" toolparamdescription="想諮詢的空間配置或風水問題"
                           placeholder="例如：主臥室與書房該如何安排？客廳財位佈置有何建議？或如何化解路沖？">
                </div>

                <button type="submit" id="suiteSubmitBtn" class="suite-btn-submit">
                    <span>✨ 生成風水格局並請教堪輿顧問</span>
                </button>
            </form>

            <!-- Visual Board -->
            <div id="suiteVisualBoard" class="suite-visual-board" hidden></div>

            <!-- 解讀與追問區域 -->
            <div id="suiteAiSection" class="suite-ai-section" hidden>
                <div class="suite-ai-header">
                    <h3 class="suite-ai-title">🏡 堪輿顧問解讀</h3>
                </div>

                <div id="suiteAiLoading" class="suite-loading-state">
                    <div class="suite-spinner"></div>
                    <div>顧問正在勘測八宅九星、飛星盤面與流年吉凶…</div>
                </div>

                <div id="suiteConversation" class="suite-conversation-stream"></div>

                <form id="suiteFollowUpForm" class="suite-follow-up-form" hidden>
                    <input type="text" id="suiteFollowUpInput" class="suite-follow-up-input" placeholder="向堪輿子先生追問（例如：床頭與書桌該如何擺放？如何移形易位？）">
                    <button type="submit" class="suite-follow-up-btn">追問</button>
                </form>
            </div>
        </div>
    </div>

    <%- include('partials/site-footer.html') %>

    <script src="/js/jquery.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/markdown-renderer.js"></script>
    <script src="/js/webmcp.js"></script>
    <script src="/js/divination-suite.js"></script>
</body>
</html>
